<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guia dos Viveiros do PROSAF · NGEO / IDEFLOR-Bio</title>
  <meta name="description" content="Consulta dos viveiros do PROSAF no Pará: dados das unidades, manual de montagem, materiais e localização por município e região." />
  <meta name="theme-color" content="#15803d" />
  <link rel="canonical" href="https://ngeo-ideflor-bio.github.io/viveiros-ideflorbio/" />
  <link rel="icon" href="assets/img/brand-mark.svg" />
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="assets/css/guia.css" />
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="#/" aria-label="Guia dos Viveiros, página inicial">
        <img src="assets/img/brand-mark.svg" alt="" />
        <span>
          <strong>Guia dos Viveiros</strong>
          <small>NGEO · IDEFLOR-Bio</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="#/" data-nav="home">Início</a>
        <a href="#/viveiros" data-nav="viveiros">Viveiros</a>
        <a href="#/entenda" data-nav="entenda">Entenda</a>
        <a href="#/montagem" data-nav="montagem">Montagem</a>
        <a href="#/fontes" data-nav="fontes">Fontes</a>
      </nav>
      <div class="head-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">Tema</button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <div id="app">
      <div class="wrap" style="padding:60px 0;color:var(--muted)">Carregando o guia...</div>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <div>
        <strong>Guia dos Viveiros do PROSAF</strong><br />
        Núcleo de Geoinformação (NGEO) · IDEFLOR-Bio · Governo do Pará
      </div>
      <nav aria-label="Links institucionais">
        <a href="https://ideflorbio.pa.gov.br/projeto-prosaf/" target="_blank" rel="noopener">PROSAF</a>
        <a href="https://ngeo-ideflor-bio.github.io/visualizador/" target="_blank" rel="noopener">Visualizador</a>
        <a href="#/fontes">Fontes e metodologia</a>
        <a href="https://github.com/NGEO-IDEFLOR-Bio/viveiros-ideflorbio" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </footer>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-overlay" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="drawer-close" type="button" data-close aria-label="Fechar ficha">×</button>
      <div id="drawer-content"></div>
    </aside>
  </div>

  <div id="map-holder" aria-hidden="true">
    <div id="map-persistent" class="map-box"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="wrap" style="padding:40px 0">
      Este guia precisa de JavaScript para exibir o mapa e os filtros. Os dados também estão
      disponíveis em <a href="assets/data/viveiros.json">JSON</a>.
    </div>
  </noscript>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="assets/js/guia.js"></script>
</body>
</html>
